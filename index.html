<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Berlin</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;box-sizing:border-box}
    h1{margin:0 0 1rem}
    img{max-width:100%;height:auto;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .info{margin-top:1rem;color:#666;font-size:0.95rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Berlin</h1>
    <img src="berlin.jpeg" alt="Berlin">
    <div class="info">Plik: <code>berlin.jpeg</code></div>
  </div>
</body>
</html>
